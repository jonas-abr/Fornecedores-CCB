<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores da Congregação</title>

    <meta
        name="description"
        content="Lista de fornecedores cadastrados e autorizados para comprar pela congregação."
    >
    <meta name="theme-color" content="#d4d9e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fornecedores CCB">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --whatsapp: #07ba4a;
            --whatsapp-dark: #069a3e;
            --maps: #ea4335;
            --background: #f5f7fa;
            --card: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        body.dark-mode {
            --background: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #374151;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.30);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        /* =========================
           CABEÇALHO
        ========================== */

        header {
            background: #d4d9e2;
            color: #1f2937;
            padding: 50px 20px;
            text-align: center;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
        }

        .logo img {
            max-width: 100%;
            height: auto;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        header p {
            font-size: 17px;
            opacity: 0.9;
            line-height: 1.6;
        }

        /* =========================
           CONTAINER
        ========================== */

        main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        /* =========================
           PESQUISA
        ========================== */

        .search-container {
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 240px;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 58px;

            padding: 0 20px 0 52px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: var(--card);

            font-size: 16px;
            color: var(--text);

            outline: none;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);

            transition: 0.2s;
        }

        #filtro-cidade {
            width: 100%;
            height: 58px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        #filtro-cidade:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 21px;
            color: var(--text-secondary);
        }

        /* =========================
           TÍTULO DA LISTA
        ========================== */

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .list-header h2 {
            font-size: 22px;
        }

        #total-fornecedores {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* =========================
           GRID
        ========================== */

        .fornecedores-grid {
            display: grid;

            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );

            gap: 20px;
        }

        /* =========================
           CARD
        ========================== */

        .fornecedor-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 24px;

            box-shadow: var(--shadow);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .fornecedor-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.10);
        }

        .fornecedor-nome {
            font-size: 20px;
            font-weight: 700;

            margin-bottom: 20px;
        }

        .informacao {
            display: flex;
            align-items: flex-start;

            gap: 12px;

            margin-bottom: 15px;

            color: var(--text-secondary);

            line-height: 1.5;
        }

        .informacao .icone {
            flex-shrink: 0;

            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;

            background: var(--border);

            font-size: 16px;
        }

        .informacao a {
            color: var(--text);
            text-decoration: none;
        }

        .informacao a:hover {
            text-decoration: underline;
        }

        /* =========================
           BOTÕES
        ========================== */

        .acoes {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 22px;
        }

        .botao {
            min-height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition: 0.2s;
        }

        .botao-whatsapp {
            background: var(--whatsapp);
        }

        .botao-whatsapp:hover {
            background: var(--whatsapp-dark);
        }

        .botao-maps {
            background: var(--primary);
        }

        .botao-maps:hover {
            background: var(--primary-dark);
        }

        /* =========================
           SEM RESULTADOS
        ========================== */

        .sem-resultados {
            display: none;

            text-align: center;

            background: var(--card);

            border-radius: 16px;

            padding: 50px 20px;

            color: var(--text-secondary);
        }

        .sem-resultados .icone {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .sem-resultados h3 {
            color: var(--text);
            margin-bottom: 8px;
        }

        /* =========================
           RODAPÉ
        ========================== */

        footer {
            text-align: center;

            padding: 25px 20px;

            color: var(--text-secondary);

            font-size: 14px;
        }

        /* =========================
           MODO ESCURO
        ========================== */

        .botao-dark {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.20);
            color: white;
            cursor: pointer;
            font-size: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(6px);
        }

        .botao-dark:hover {
            transform: scale(1.08);
            background: rgba(0, 0, 0, 0.35);
        }

        .install-notice {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            width: min(620px, calc(100% - 32px));
            padding: 18px 20px;
            transform: translateX(-50%);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 14px;
            background: var(--card);
            color: var(--text);
            box-shadow: var(--shadow);
        }

        .install-notice[hidden] {
            display: none;
        }

        .install-notice h2 {
            margin-bottom: 5px;
            font-size: 16px;
        }

        .install-notice p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.45;
        }

        .install-notice-actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
        }

        .install-notice button {
            min-height: 42px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
        }

        .install-notice #instalar-app {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .install-notice #instalar-app:hover {
            background: var(--primary-dark);
        }

        @media (max-width: 767px) {
            .botao-dark {
                top: 12px;
                right: 12px;
                width: 44px;
                height: 44px;
            }

            .install-notice {
                align-items: stretch;
                flex-direction: column;
                gap: 12px;
                padding: 16px;
            }

            .install-notice-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 767px) {

            header {
                padding: 40px 20px;
            }

            header h1 {
                font-size: 27px;
            }

            header p {
                font-size: 15px;
            }

            main {
                padding: 25px 15px 45px;
            }

            .search-container {
                grid-template-columns: 1fr;
            }

            .fornecedores-grid {
                grid-template-columns: 1fr;
            }

            .fornecedor-card {
                padding: 20px;
            }

            .acoes {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {

            .fornecedores-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <button
        id="botao-dark"
        class="botao-dark"
        type="button"
        aria-label="Ativar modo escuro"
        title="Ativar modo escuro"
    >🌙</button>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="header-content">

            <div class="logo">
                <img src="logotipo.png" alt="Logotipo da Congregação">
            </div>

            <h1>
                Fornecedores da Congregação Cristã no Brasil
            </h1>

            <p>
                Administração de São Vicente
            </p>

        </div>

    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main>

        <!-- PESQUISA -->

        <section class="search-container">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="campo-pesquisa"
                    placeholder="Pesquisar fornecedor..."
                    autocomplete="off"
                >

            </div>

            <select id="filtro-cidade" aria-label="Filtrar por cidade">
                <option value="">Todas as cidades</option>
            </select>

        </section>


        <!-- LISTA -->

        <div class="list-header">

            <h2>
                Fornecedores
            </h2>

            <span id="total-fornecedores">
                0 fornecedores
            </span>

        </div>


        <!-- CARDS -->

        <section
            id="lista-fornecedores"
            class="fornecedores-grid"
        >
        </section>


        <!-- SEM RESULTADOS -->

        <div
            id="sem-resultados"
            class="sem-resultados"
        >

            <div class="icone">
                🔎
            </div>

            <h3>
                Nenhum fornecedor encontrado
            </h3>

            <p>
                Tente pesquisar por outro nome ou endereço.
            </p>

        </div>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        © 2026 - Administração da São Vicente

    </footer>


    <script>

        /*
        ==========================================
        DADOS DOS FORNECEDORES
        ==========================================

        Para adicionar um fornecedor, basta copiar
        um dos objetos abaixo e alterar os dados.

        O telefone deve conter apenas números,
        incluindo o código do país.

        Exemplo:

        Brasil +55
        São Paulo (11)
        Número 99999-9999

        Resultado:

        5511999999999
        */

        const fornecedores = [

            {
                nome: "Bazar da Construção",
                telefone: "13982035908",
                telefoneFormatado: "(13) 98203-5908",
                cidade: "São Vicente",
                endereco: "Av. Dom Pedro II, 1073 - Conj. Res. Tancredo Neves, São Vicente"
            },

            {
                nome: "Correia Materiais",
                telefone: "13974152919",
                telefoneFormatado: "(13) 97415-2919",
                cidade: "São Vicente",
                endereco: "Av. Augusto Severo, 45 - Parque Sao Vicente, São Vicente - SP"
            },

            {
                nome: "Bela Tintas",
                telefone: "5513974166404",
                telefoneFormatado: "(11) 97777-7777",
                cidade: "São Vicente",
                endereco: "Av. Antônio Emmerich, 819 - Vila Cascatinha, São Vicente - SP"
            },

            {
                nome: "Adriex",
                telefone: "5513974104504",
                telefoneFormatado: "(13) 97410-4504",
                cidade: "São Vicente",
                endereco: "Av. Nações Unidas, 1196 - Vila Margarida, São Vicente - SP"
            },

            {
                nome: "Andra Materiais Eletricos",
                telefone: "5513997360060",
                telefoneFormatado: "(13) 99736-0060",
                cidade: "Santos",
                endereco: "Av. Senador Feijó, 414 - Vila Mathias, Santos - SP"
            }

        ];


        /*
        ==========================================
        ELEMENTOS
        ==========================================
        */

        const listaFornecedores =
            document.getElementById(
                "lista-fornecedores"
            );

        const campoPesquisa =
            document.getElementById(
                "campo-pesquisa"
            );

        const filtroCidade =
            document.getElementById(
                "filtro-cidade"
            );

        const totalFornecedores =
            document.getElementById(
                "total-fornecedores"
            );

        const semResultados =
            document.getElementById(
                "sem-resultados"
            );


        /*
        ==========================================
        CRIAR LINK DO WHATSAPP
        ==========================================
        */

        function criarLinkWhatsApp(telefone) {

            const mensagem =
                "Olá! Gostaria de fazer um orçamento.";

            return `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;

        }


        /*
        ==========================================
        CRIAR LINK DO GOOGLE MAPS
        ==========================================
        */

        function criarLinkMaps(endereco) {

            return (
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(endereco)
            );

        }


        /*
        ==========================================
        EXIBIR FORNECEDORES
        ==========================================
        */

        function exibirFornecedores(lista) {

            listaFornecedores.innerHTML = "";

            totalFornecedores.textContent =
                `${lista.length} fornecedor${lista.length !== 1 ? "es" : ""}`;


            if (lista.length === 0) {

                semResultados.style.display = "block";

                return;

            }


            semResultados.style.display = "none";


            lista.forEach(fornecedor => {

                const card =
                    document.createElement("article");

                card.className =
                    "fornecedor-card";


                const linkWhatsApp =
                    criarLinkWhatsApp(
                        fornecedor.telefone
                    );


                const linkMaps =
                    criarLinkMaps(
                        fornecedor.endereco
                    );


                card.innerHTML = `

                    <h3 class="fornecedor-nome">
                        ${fornecedor.nome}
                    </h3>


                    <div class="informacao">

                        <span class="icone">
                            📞
                        </span>

                        <a
                            href="${linkWhatsApp}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${fornecedor.telefoneFormatado}
                        </a>

                    </div>


                    <div class="informacao">

                        <span class="icone">
                            📍
                        </span>

                        <a
                            href="${linkMaps}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${fornecedor.endereco}
                        </a>

                    </div>


                    <div class="acoes">

                        <a
                            href="${linkWhatsApp}"
                            class="botao botao-whatsapp"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            💬 WhatsApp
                        </a>


                        <a
                            href="${linkMaps}"
                            class="botao botao-maps"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            📍 Ver no Mapa
                        </a>

                    </div>

                `;


                listaFornecedores.appendChild(card);

            });

        }


        /*
        ==========================================
        PESQUISA
        ==========================================
        */

        function filtrarFornecedores() {
            const termo = campoPesquisa.value.toLowerCase().trim();
            const cidadeSelecionada = filtroCidade.value;

            const resultados = fornecedores.filter(fornecedor => {
                const correspondeBusca =
                    fornecedor.nome.toLowerCase().includes(termo)
                    || fornecedor.endereco.toLowerCase().includes(termo)
                    || fornecedor.telefoneFormatado.toLowerCase().includes(termo);

                return correspondeBusca
                    && (!cidadeSelecionada || fornecedor.cidade === cidadeSelecionada);
            });

            exibirFornecedores(resultados);
        }

        [...new Set(fornecedores.map(fornecedor => fornecedor.cidade))]
            .sort((cidadeA, cidadeB) => cidadeA.localeCompare(cidadeB, "pt-BR"))
            .forEach(cidade => {
                const opcao = document.createElement("option");
                opcao.value = cidade;
                opcao.textContent = cidade;
                filtroCidade.appendChild(opcao);
            });

        campoPesquisa.addEventListener("input", filtrarFornecedores);
        filtroCidade.addEventListener("change", filtrarFornecedores);


        /*
        ==========================================
        MODO ESCURO
        ==========================================
        */

        const botaoDark = document.getElementById("botao-dark");

        const modoDarkSalvo = localStorage.getItem("modoDark") === "true";

        if (modoDarkSalvo) {
            document.body.classList.add("dark-mode");
            botaoDark.textContent = "☀️";
            botaoDark.setAttribute("aria-label", "Desativar modo escuro");
            botaoDark.setAttribute("title", "Desativar modo escuro");
        }

        botaoDark.addEventListener("click", function () {
            const ativo = document.body.classList.toggle("dark-mode");

            localStorage.setItem("modoDark", ativo);

            this.textContent = ativo ? "☀️" : "🌙";
            this.setAttribute(
                "aria-label",
                ativo ? "Desativar modo escuro" : "Ativar modo escuro"
            );
            this.setAttribute(
                "title",
                ativo ? "Desativar modo escuro" : "Ativar modo escuro"
            );
        });


        /*
        ==========================================
        INICIALIZAÇÃO
        ==========================================
        */

        exibirFornecedores(fornecedores);

        const avisoInstalacao = document.getElementById("aviso-instalacao");
        const descricaoInstalacao = document.getElementById("descricao-instalacao");
        const botaoInstalar = document.getElementById("instalar-app");
        const botaoDispensar = document.getElementById("dispensar-instalacao");
        const eIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const appInstalado = window.matchMedia("(display-mode: standalone)").matches
            || navigator.standalone === true;
        let promptInstalacao = null;

        if (!appInstalado) {
            avisoInstalacao.hidden = false;

            if (eIOS) {
                descricaoInstalacao.textContent =
                    "No Safari, toque em Compartilhar e escolha Adicionar à Tela de Início.";
                botaoInstalar.textContent = "Como instalar";
            }
        }

        window.addEventListener("beforeinstallprompt", evento => {
            evento.preventDefault();
            promptInstalacao = evento;
            descricaoInstalacao.textContent =
                "Adicione os fornecedores à sua tela inicial para acessar mais rápido.";
            botaoInstalar.hidden = false;
            botaoInstalar.textContent = "Instalar app";
        });

        botaoInstalar.addEventListener("click", async () => {
            if (!promptInstalacao) {
                if (!eIOS) {
                    descricaoInstalacao.textContent =
                        "Abra o menu do navegador e escolha Instalar app ou Adicionar à tela inicial.";
                }

                botaoInstalar.hidden = true;
                return;
            }

            const evento = promptInstalacao;
            promptInstalacao = null;
            await evento.prompt();

            const escolha = await evento.userChoice;
            if (escolha.outcome === "accepted") {
                avisoInstalacao.hidden = true;
            } else {
                descricaoInstalacao.textContent =
                    "Você pode instalar depois pelo menu do navegador.";
                botaoInstalar.hidden = true;
            }
        });

        botaoDispensar.addEventListener("click", () => {
            avisoInstalacao.hidden = true;
        });

        window.addEventListener("appinstalled", () => {
            avisoInstalacao.hidden = true;
        });

        if ("serviceWorker" in navigator && window.isSecureContext) {
            navigator.serviceWorker.register("./service-worker.js");
        }

    </script>

</body>
</html>
